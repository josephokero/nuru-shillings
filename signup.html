<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · Nuru Shillings</title>
  <meta name="description" content="Open a free Nuru Shillings wallet with your email. No password.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="app.css?v=1">
</head>
<body>
  <header class="auth-top">
    <a class="brand" href="/">Nuru</a>
    <a class="btn sm" href="/signin">Log In</a>
  </header>
  <main class="auth-wrap">
    <div class="auth-card" id="card">
      <section id="ask">
        <h1>Your wallet is just<br>a sign-up away.</h1>
        <form id="form" novalidate>
          <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <label class="field"><span>Email</span><input class="input" type="email" name="email" required autocomplete="email" placeholder="you@example.com" autofocus></label>
          <button class="btn primary block" type="submit">Continue with Email</button>
          <p class="msg" id="msg" role="status"></p>
        </form>
        <p class="auth-alt">Already have an account? <a class="link" href="/signin">Log in</a></p>
        <p class="auth-legal">By joining, you agree to our <a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a></p>
      </section>
      <section class="auth-sent" id="sent" hidden>
        <div class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>
        <h1>Check your email</h1>
        <p>We sent a link to <b id="sent-to"></b>.<br>Open it to create your account.</p>
        <div class="actions">
          <button class="btn block" type="button" id="resend">Resend link</button>
          <button class="btn block" type="button" id="back">Use a different email</button>
        </div>
        <p class="msg" id="msg2" role="status"></p>
        <p class="auth-foot">The link works once and expires in 20 minutes.</p>
      </section>
    </div>
  </main>
  <script src="nsh.js?v=1"></script>
  <script src="auth-page.js?v=2"></script>
</body>
</html>
